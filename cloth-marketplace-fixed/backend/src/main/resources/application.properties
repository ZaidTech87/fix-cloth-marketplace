# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cloth_marketplace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme_local_only}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB

# Upload directory (local fallback only - see Step 5 for Cloudinary)
upload.path=uploads/



# CORS Configuration (STEP 4 FIX: env var se, production domain env me set karein)
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Cloudinary Configuration (STEP 5 - optional, empty = local disk fallback)
cloudinary.url=${CLOUDINARY_URL:}

# Logging (STEP 7 FIX: production me DEBUG band, env se control hota hai)
logging.level.com.clothmarket=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_LOG_LEVEL:WARN}

# Chatbot Configuration (Groq API - OpenAI-compatible format)
groq.api.key=${GROQ_API_KEY:}
groq.api.model=llama-3.3-70b-versatile
groq.api.url=https://api.groq.com/openai/v1/chat/completions


# Content Moderation (Sightengine - NSFW detection)
sightengine.api.user=${SIGHTENGINE_API_USER:}
sightengine.api.secret=${SIGHTENGINE_API_SECRET:}
sightengine.api.url=https://api.sightengine.com/1.0/check.json